kind = "web"
previewPath = "/"
title = "Student Management System"
description = "A full-stack student records application for creating, viewing, searching, editing, and deleting student profiles with validation and a responsive interface."
version = "1.0.0"
id = "artifacts/student-management-system"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22847

[services.development]
run = "pnpm --filter @workspace/student-management-system run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/student-management-system", "run", "build" ]
serve = "static"
publicDir = "artifacts/student-management-system/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22847"
BASE_PATH = "/"
